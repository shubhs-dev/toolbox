[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shubhs-toolbox"
version = "0.1.0"
description = "Personal CLI toolbox for media processing and game modding"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shubhanshu", email = "shubhanshu@createdigitalsolutions.com" }]

dependencies = [
    "rich>=15",
    "send2trash>=2.2",
]

[project.scripts]
addsub = "toolboxcli.addsub.cli:main"
autosub = "toolboxcli.autosub.cli:main"
check-deps = "toolboxcli.checkdeps.cli:main"
compressvid = "toolboxcli.compressvid.cli:main"
concatvid = "toolboxcli.concatvid.cli:main"
convertimg = "toolboxcli.convertimg.cli:main"
cutvid = "toolboxcli.cutvid.cli:main"
cybermod = "toolboxcli.cybermod.cli:main"
downscalevid = "toolboxcli.downscalevid.cli:main"
finddupes = "toolboxcli.finddupes.cli:main"
flatten = "toolboxcli.flatten.cli:main"
flipvid = "toolboxcli.flipvid.cli:main"
jellyname = "toolboxcli.jellyname.cli:main"
kavitaname = "toolboxcli.kavitaname.cli:main"
mergemanga = "toolboxcli.mergemanga.cli:main"
prunelib = "toolboxcli.prunelib.cli:main"
sortmedia = "toolboxcli.sortmedia.cli:main"
toolbox = "toolboxcli.toolbox.cli:main"
vidlib = "toolboxcli.vidlib.cli:main"
wallready = "toolboxcli.wallready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"toolboxcli.compressvid" = ["data/handbrake-presets/*.json"]
"toolboxcli.mergemanga" = ["data/*.json"]
"toolboxcli.vidlib" = ["data/web/*"]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]   # so test modules can `from conftest import ...`
addopts = ["-ra"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"   # matches requires-python
typeCheckingMode = "basic"
# The I/O-free logic modules are held to strict: they're where the parsing and decision
# logic lives, and they take plain values, so full types cost little there.
strict = ["src/toolboxcli/*/core.py", "src/toolboxcli/vidlib/naming.py"]
venvPath = "."
venv = ".venv"

[tool.ruff]
src = ["src"]
target-version = "py311"   # matches requires-python
line-length = 100

[tool.ruff.lint]
# Correctness-focused: pyflakes, pycodestyle, bugbear, import order, pyupgrade, pylint errors.
# Deliberately no complexity/style opinions (too-many-branches, magic numbers, pathlib-only).
select = ["E", "W", "F", "B", "I", "UP", "PLE"]
ignore = [
    "E501",   # long help strings and regexes are deliberate; there's no formatter to wrap them
]

[tool.ruff.lint.isort]
combine-as-imports = true
